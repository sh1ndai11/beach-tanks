<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beach Tanks</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1f2e; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #menu { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #1d6e8c, #0b1f2e 70%); z-index: 5; }
  .card { width: min(92vw, 420px); padding: 32px; border-radius: 22px; text-align: center; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(10px); box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  h1 { margin: 0 0 6px; font-size: 40px; letter-spacing: 4px; background: linear-gradient(90deg, #ffd23f, #ff8f3f); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card p { opacity: .75; margin: 0 0 20px; }
  input { width: 100%; padding: 13px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.3); color: #fff; font: inherit; font-size: 17px; text-align: center; outline: none; }
  input:focus { border-color: #ffd23f; }
  button { margin-top: 14px; width: 100%; padding: 14px; border: 0; border-radius: 12px; font: inherit; font-size: 18px; font-weight: 800; letter-spacing: 2px; cursor: pointer; color: #1a1200; background: linear-gradient(90deg, #ffd23f, #ff8f3f); box-shadow: 0 0 24px rgba(255,170,60,.5); }
  button:hover { transform: scale(1.03); }
  .help { margin-top: 18px; font-size: 13px; opacity: .75; line-height: 1.7; }
  kbd { display: inline-block; min-width: 24px; padding: 2px 7px; border-radius: 6px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.1); }
  #err { color: #ff8a8a; min-height: 20px; margin-top: 10px; font-size: 14px; }
  #hud { position: absolute; top: 10px; right: 10px; min-width: 200px; padding: 10px 14px; border-radius: 14px; background: rgba(0,0,0,.45); backdrop-filter: blur(6px); font-size: 14px; z-index: 3; }
  #hud h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: 2px; opacity: .7; text-transform: uppercase; }
  .row { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; }
  .row .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; }
  .row.me { font-weight: 700; }
  #feed { position: absolute; top: 10px; left: 10px; z-index: 3; font-size: 14px; }
  #feed div { margin-bottom: 4px; padding: 5px 10px; border-radius: 8px; background: rgba(0,0,0,.45); animation: fade 5s forwards; }
  @keyframes fade { 0%,80% { opacity: 1; } 100% { opacity: 0; } }
  #dead { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 34px; font-weight: 800; text-shadow: 0 0 20px #000; z-index: 3; display: none; text-align: center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><h3>Таблица</h3><div id="board"></div></div>
<div id="feed"></div>
<div id="dead"></div>

<div id="menu">
  <div class="card">
    <h1>BEACH TANKS</h1>
    <p>Танковая битва на пляже</p>
    <input id="name" maxlength="14" placeholder="Твой ник" autocomplete="off">
    <button id="go">В БОЙ</button>
    <div id="err"></div>
    <div class="help"><kbd>W</kbd><kbd>S</kbd> — вперёд / назад<br><kbd>A</kbd><kbd>D</kbd> — поворот танка<br><kbd>Пробел</kbd> — огонь<br>3 попадания — и танк уничтожен</div>
  </div>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let ws, me = null, map = null, players = [], bullets = [], scale = 1, ox = 0, oy = 0;
let bulletsAt = 0, pred = null, shake = 0;
const smooth = new Map();                        // id -> {x,y,a} rendered pose of other tanks
let particles = [], tracks = [], flashes = [];
const keys = { w: 0, a: 0, s: 0, d: 0, fire: 0 };
$('name').value = localStorage.getItem('tankName') || '';

function resize() {
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  if (map) {
    scale = Math.min(cv.width / map.W, cv.height / map.H);
    ox = (cv.width - map.W * scale) / 2; oy = (cv.height - map.H * scale) / 2;
  }
}
addEventListener('resize', resize);

function connect() {
  const name = $('name').value.trim();
  localStorage.setItem('tankName', name);
  $('err').textContent = '';
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => ws.send(JSON.stringify({ type: 'join', name }));
  ws.onerror = () => { $('err').textContent = 'Не удалось подключиться к серверу'; };
  ws.onclose = () => { $('menu').style.display = 'flex'; me = null; };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'init') { me = m.id; map = m; $('menu').style.display = 'none'; resize(); }
    else if (m.type === 'state') {
      players = m.players; bullets = m.bullets; bulletsAt = performance.now();
      m.fx.forEach(handleFx); updateHud();
    }
    else if (m.type === 'kill') feed('💥 ' + m.killer + ' уничтожил ' + m.victim);
    else if (m.type === 'info') feed(m.text);
    else if (m.type === 'full') $('err').textContent = 'Сервер заполнен, попробуй позже';
  };
}
$('go').onclick = connect;
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });

function feed(text) {
  const d = document.createElement('div'); d.textContent = text; $('feed').appendChild(d);
  setTimeout(() => d.remove(), 5000);
  while ($('feed').children.length > 6) $('feed').firstChild.remove();
}
function updateHud() {
  const sorted = [...players].sort((a, b) => b.kills - a.kills || a.deaths - b.deaths);
  $('board').innerHTML = sorted.map(p =>
    `<div class="row ${p.id === me ? 'me' : ''}"><span><span class="dot" style="background:${p.color}"></span>${p.name.replace(/</g, '&lt;')}</span><span>${p.kills} / ${p.deaths}</span></div>`).join('');
  const mine = players.find(p => p.id === me);
  $('dead').style.display = mine && mine.dead ? 'block' : 'none';
  $('dead').textContent = 'Танк уничтожен — респавн...';
}

// ---------- input ----------
const KEYMAP = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd', Space: 'fire' };
function sendInput() { if (ws && ws.readyState === 1 && me) ws.send(JSON.stringify({ type: 'input', ...keys })); }
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (!k || e.target.tagName === 'INPUT') return;
  e.preventDefault();
  if (!keys[k]) { keys[k] = 1; sendInput(); }
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  if (keys[k]) { keys[k] = 0; sendInput(); }
});
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; sendInput(); });
setInterval(sendInput, 200);   // keep-alive in case a packet is lost

// ---------- rendering ----------
let sand = null, deco = [];
function seeded(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function makeDeco() {
  const rnd = seeded(42);
  deco = [];
  for (let i = 0; i < 260; i++) {
    const x = map.WATER + rnd() * (map.W - 2 * map.WATER), y = map.WATER + rnd() * (map.H - 2 * map.WATER);
    deco.push({ x, y, r: 1 + rnd() * 2.5, c: rnd() < .5 ? 'rgba(180,140,80,.35)' : 'rgba(255,245,210,.4)' });
  }
  for (let i = 0; i < 6; i++) {
    const x = map.WATER + 30 + rnd() * (map.W - 2 * map.WATER - 60), y = map.WATER + 30 + rnd() * (map.H - 2 * map.WATER - 60);
    deco.push({ x, y, shell: true, rot: rnd() * 6 });
  }
}

function drawBeach(t) {
  const { W, H, WATER } = map;
  // water
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1b8fb5'); g.addColorStop(1, '#0f6f94');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // wet sand + sand
  ctx.fillStyle = '#d9b97a'; ctx.beginPath(); ctx.roundRect(WATER - 10, WATER - 10, W - 2 * WATER + 20, H - 2 * WATER + 20, 40); ctx.fill();
  ctx.fillStyle = '#efd49a'; ctx.beginPath(); ctx.roundRect(WATER, WATER, W - 2 * WATER, H - 2 * WATER, 34); ctx.fill();
  // animated foam
  const f = 6 + Math.sin(t / 700) * 5;
  ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(WATER - 10 - f, WATER - 10 - f, W - 2 * WATER + 20 + 2 * f, H - 2 * WATER + 20 + 2 * f, 44); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(WATER - 22 - f * 1.6, WATER - 22 - f * 1.6, W - 2 * WATER + 44 + 3.2 * f, H - 2 * WATER + 44 + 3.2 * f, 52); ctx.stroke();
  // sand speckles + shells
  for (const d of deco) {
    if (d.shell) {
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot); ctx.fillStyle = '#ffd6d0';
      ctx.beginPath(); ctx.ellipse(0, 0, 9, 6, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = '#e9a79e'; ctx.lineWidth = 1; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 2.5, -5); ctx.lineTo(i * 2.5, 5); ctx.stroke(); }
      ctx.restore();
    } else { ctx.fillStyle = d.c; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill(); }
  }
}

function drawObstacle(o) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
  if (o.t === 'crate') {
    ctx.fillStyle = '#a8742f'; ctx.fillRect(o.x, o.y, o.w, o.h); ctx.shadowColor = 'transparent';
    ctx.strokeStyle = '#6d4716'; ctx.lineWidth = 3; ctx.strokeRect(o.x + 2, o.y + 2, o.w - 4, o.h - 4);
    ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x + o.w, o.y + o.h); ctx.moveTo(o.x + o.w, o.y); ctx.lineTo(o.x, o.y + o.h); ctx.stroke();
  } else if (o.t === 'sandbag') {
    ctx.fillStyle = '#b79a5c'; ctx.beginPath(); ctx.roundRect(o.x, o.y, o.w, o.h, 10); ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.strokeStyle = '#7d6636'; ctx.lineWidth = 2;
    const horiz = o.w >= o.h, n = Math.round((horiz ? o.w : o.h) / 40);
    for (let i = 1; i < n; i++) { ctx.beginPath(); if (horiz) { ctx.moveTo(o.x + i * o.w / n, o.y + 3); ctx.lineTo(o.x + i * o.w / n, o.y + o.h - 3); } else { ctx.moveTo(o.x + 3, o.y + i * o.h / n); ctx.lineTo(o.x + o.w - 3, o.y + i * o.h / n); } ctx.stroke(); }
    ctx.beginPath(); ctx.roundRect(o.x, o.y, o.w, o.h, 10); ctx.stroke();
  } else { // rock
    ctx.fillStyle = '#7b7f86'; ctx.beginPath(); ctx.roundRect(o.x, o.y, o.w, o.h, Math.min(o.w, o.h) / 2.4); ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.roundRect(o.x + 6, o.y + 6, o.w * .55, o.h * .35, 12); ctx.fill();
    ctx.strokeStyle = '#575a60'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(o.x, o.y, o.w, o.h, Math.min(o.w, o.h) / 2.4); ctx.stroke();
  }
  ctx.restore();
}

function drawTank(p, s) {
  ctx.save(); ctx.translate(s.x, s.y);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(3, 6, 22, 18, 0, 0, 7); ctx.fill();
  ctx.rotate(s.a);
  ctx.fillStyle = '#2b2b2b'; ctx.fillRect(-20, -19, 40, 9); ctx.fillRect(-20, 10, 40, 9);       // tracks
  ctx.fillStyle = p.color; ctx.beginPath(); ctx.roundRect(-17, -12, 34, 24, 6); ctx.fill();    // hull
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(-17, 4, 34, 8);
  ctx.fillStyle = '#333'; ctx.fillRect(4, -3.5, 26, 7);                                         // barrel
  ctx.fillStyle = p.color; ctx.filter = 'brightness(1.2)'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.fill(); ctx.filter = 'none';
  ctx.restore();
  // name + hp bar
  ctx.textAlign = 'center'; ctx.font = '600 13px Segoe UI, sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillText(p.name, s.x + 1, s.y - 34 + 1);
  ctx.fillStyle = p.id === me ? '#fff6b0' : '#fff'; ctx.fillText(p.name, s.x, s.y - 34);
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(s.x - 20, s.y - 29, 40, 5);
  ctx.fillStyle = p.hp > 1 ? '#5cf08a' : '#ff5a5a'; ctx.fillRect(s.x - 20, s.y - 29, 40 * p.hp / 3, 5);
}

// ---------- effects ----------
function puff(x, y, n, o) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = (o.v || 2) * (.3 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, dec: o.dec || .04, size: o.size || 3, grow: o.grow || 0, color: o.color, glow: o.glow });
  }
}
function handleFx(f) {
  if (f.k === 'shot') {
    flashes.push({ x: f.x, y: f.y, a: f.a, life: 1 });
    puff(f.x, f.y, 5, { v: 2.5, size: 2.5, color: '255,200,80', dec: .09, glow: true });
    puff(f.x, f.y, 3, { v: .8, size: 5, grow: .25, color: '200,200,200', dec: .03 });
  } else if (f.k === 'wall') {
    puff(f.x, f.y, 8, { v: 3, size: 2.5, color: '230,200,140', dec: .06 });
  } else if (f.k === 'hit') {
    puff(f.x, f.y, 10, { v: 4, size: 2.5, color: '255,160,40', dec: .06, glow: true });
    if (f.id === me) shake = Math.max(shake, 9);
  } else if (f.k === 'boom') {
    puff(f.x, f.y, 26, { v: 6, size: 3.5, color: '255,150,30', dec: .03, glow: true });
    puff(f.x, f.y, 14, { v: 3, size: 8, grow: .6, color: '60,60,60', dec: .015 });
    puff(f.x, f.y, 10, { v: 2, size: 4, color: f.c.replace('#', ''), dec: .025 });
    particles.push({ x: f.x, y: f.y, vx: 0, vy: 0, life: 1, dec: .05, size: 10, grow: 5, ring: true });
    shake = Math.max(shake, Math.hypot(f.x - (pred ? pred.x : 0), f.y - (pred ? pred.y : 0)) < 400 ? 14 : 5);
  }
}
function colorToRgb(c) {   // 'rrggbb' -> 'r,g,b' (puff color for boom debris)
  return /^[0-9a-f]{6}$/i.test(c) ? [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)).join(',') : c;
}

function drawFx(dt60) {
  // tracks
  for (const t of tracks) {
    t.life -= .004 * dt60;
    ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(t.a);
    ctx.fillStyle = `rgba(110,85,45,${Math.max(t.life, 0) * .45})`;
    ctx.fillRect(-4, -17, 8, 5); ctx.fillRect(-4, 12, 8, 5);
    ctx.restore();
  }
  tracks = tracks.filter(t => t.life > 0);
}
function drawParticles(dt60) {
  for (const p of particles) {
    p.x += p.vx * dt60; p.y += p.vy * dt60; p.vx *= .96; p.vy *= .96;
    p.life -= p.dec * dt60; p.size += p.grow * dt60;
    if (p.life <= 0) continue;
    if (p.ring) {
      ctx.strokeStyle = `rgba(255,220,120,${p.life})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.stroke();
      continue;
    }
    ctx.fillStyle = `rgba(${colorToRgb(p.color)},${p.life * (p.grow ? .55 : 1)})`;
    if (p.glow) { ctx.shadowColor = `rgb(${p.color})`; ctx.shadowBlur = 10; }
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(p.size * (p.grow ? 1 : p.life), .5), 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
  }
  particles = particles.filter(p => p.life > 0);
  for (const f of flashes) {
    f.life -= .15 * dt60;
    if (f.life <= 0) continue;
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
    ctx.fillStyle = `rgba(255,230,120,${f.life})`; ctx.shadowColor = '#ffb300'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(18 * f.life + 6, -7 * f.life); ctx.lineTo(18 * f.life + 6, 7 * f.life); ctx.fill();
    ctx.restore();
  }
  flashes = flashes.filter(f => f.life > 0);
}

// ---------- own-tank prediction (responsive controls) ----------
function blockedLocal(x, y, r) {
  if (x - r < map.WATER || y - r < map.WATER || x + r > map.W - map.WATER || y + r > map.H - map.WATER) return true;
  return map.obstacles.some(o => {
    const nx = Math.max(o.x, Math.min(x, o.x + o.w)), ny = Math.max(o.y, Math.min(y, o.y + o.h));
    return (x - nx) ** 2 + (y - ny) ** 2 < r * r;
  });
}
function normA(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
function stepPred(dt, srv) {
  if (!pred || srv.dead) { pred = { x: srv.x, y: srv.y, a: srv.a }; return; }
  pred.a = normA(pred.a + (keys.d - keys.a) * map.TURN * dt);
  const drive = keys.w - keys.s;
  if (drive) {
    const sp = map.SPEED * (drive > 0 ? 1 : map.REVERSE) * dt * drive;
    const mx = Math.cos(pred.a) * sp, my = Math.sin(pred.a) * sp;
    if (!blockedLocal(pred.x + mx, pred.y, map.R)) pred.x += mx;
    if (!blockedLocal(pred.x, pred.y + my, map.R)) pred.y += my;
  }
  // gently pull toward the authoritative server state
  const err = Math.hypot(srv.x - pred.x, srv.y - pred.y);
  if (err > 70) { pred.x = srv.x; pred.y = srv.y; return; }
  const moving = drive || keys.a || keys.d;
  const k = (moving ? (err > 30 ? .08 : .02) : .2);
  pred.x += (srv.x - pred.x) * k; pred.y += (srv.y - pred.y) * k;
  if (!moving) pred.a += normA(srv.a - pred.a) * .2;
}

let lastT = performance.now(), smokeT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min((t - lastT) / 1000, .1); lastT = t;
  const dt60 = dt * 60;
  ctx.fillStyle = '#0b1f2e'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!map) return;
  if (!deco.length) makeDeco();
  const mine = players.find(p => p.id === me);
  if (mine) stepPred(dt, mine);

  ctx.save(); ctx.translate(ox, oy); ctx.scale(scale, scale);
  if (shake > .3) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= Math.pow(.9, dt60); }
  drawBeach(t);
  drawFx(dt60);
  map.obstacles.forEach(drawObstacle);

  const ids = new Set();
  smokeT += dt;
  for (const p of players) {
    ids.add(p.id);
    let s = smooth.get(p.id);
    if (!s || Math.hypot(s.x - p.x, s.y - p.y) > 120) { s = { x: p.x, y: p.y, a: p.a, lx: p.x, ly: p.y }; smooth.set(p.id, s); }
    if (p.id === me && pred) { s.x = pred.x; s.y = pred.y; s.a = pred.a; }
    else {
      s.x += (p.x - s.x) * Math.min(1, .35 * dt60); s.y += (p.y - s.y) * Math.min(1, .35 * dt60);
      s.a += normA(p.a - s.a) * Math.min(1, .35 * dt60);
    }
    if (p.dead) { s.lx = s.x; s.ly = s.y; continue; }
    if (Math.hypot(s.x - s.lx, s.y - s.ly) > 14) { tracks.push({ x: s.x, y: s.y, a: s.a, life: 1 }); s.lx = s.x; s.ly = s.y; }
    if (p.hp === 1 && smokeT > .07) puff(s.x - Math.cos(s.a) * 8, s.y - Math.sin(s.a) * 8, 1, { v: .8, size: 4, grow: .15, color: '70,70,70', dec: .02 });
    drawTank(p, s);
  }
  if (smokeT > .07) smokeT = 0;
  for (const id of smooth.keys()) if (!ids.has(id)) smooth.delete(id);

  // bullets (extrapolated between server updates)
  const age = Math.min((performance.now() - bulletsAt) / 1000, .1);
  ctx.shadowColor = '#ffb300'; ctx.shadowBlur = 12;
  for (const b of bullets) {
    const x = b.x + b.vx * age, y = b.y + b.vy * age;
    ctx.strokeStyle = 'rgba(255,200,80,.5)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - b.vx * .03, y - b.vy * .03); ctx.stroke();
    ctx.fillStyle = '#fff3a0'; ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 7); ctx.fill();
  }
  ctx.shadowBlur = 0;
  drawParticles(dt60);
  ctx.restore();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
